<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>财报分析智能体 financial-report-claw</title>
<script src="/static/echarts.min.js" defer></script>
<style>
:root{--bg:#0d0f12;--side:#101318;--card:#14171d;--hi:#1a1e26;--inset:#090b0e;--bd:#232833;--bd2:#2f3642;
--t1:#e9e7e0;--t2:#9ba1ab;--t3:#828b99;--gold:#c9a45c;--gold2:#dfc07e;--gold3:#a8863f;
--up:#e5483f;--dn:#2ba471;--warn:#e0a03c;--info:#5b8def;--purple:#9a86d8;
--upS:rgba(229,72,63,.14);--dnS:rgba(43,164,113,.14);--goldS:rgba(201,164,92,.13);--warnS:rgba(224,160,60,.14);--infoS:rgba(91,141,239,.13);
--num:"SF Mono","JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font:13.5px/1.6 "PingFang SC","Microsoft YaHei",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
a{color:var(--gold2);text-decoration:none}
.app{display:flex;min-height:100vh}
/* topbar */
.top{position:fixed;top:0;left:0;right:0;height:52px;z-index:50;display:flex;align-items:center;gap:16px;padding:0 18px;
 background:linear-gradient(180deg,#12151b,#0e1116);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold3));box-shadow:0 0 12px rgba(201,164,92,.7)}
.brand span{color:var(--t3);font-weight:500;font-size:11px}
.tsr{display:flex;gap:14px;overflow:hidden;flex:1;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tki{display:flex;gap:7px;align-items:baseline;font-size:12.5px;white-space:nowrap}
.tki b{font-weight:600;color:var(--t2)}
.gsearch{width:250px}
.gsearch input{width:100%;background:var(--inset);border:1px solid var(--bd2);color:var(--t1);border-radius:8px;padding:7px 12px;font-size:13px;outline:none}
.gsearch input:focus{border-color:var(--gold)}
/* layout */
.side{position:fixed;top:52px;bottom:0;left:0;width:196px;background:var(--side);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;overflow:auto}
.main{margin:52px 0 0 196px;padding:20px 24px;min-width:0}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;color:var(--t2);font-size:13px;cursor:pointer;margin-bottom:2px;border-left:2px solid transparent}
.nav a:hover{background:var(--hi);color:var(--t1)}
.nav a.on{background:linear-gradient(90deg,var(--goldS),transparent);color:var(--gold2);border-left-color:var(--gold)}
.nav .grp{color:var(--t3);font-size:11px;padding:12px 12px 5px;letter-spacing:.6px}
.side .foot{margin-top:auto;font-size:11px;color:var(--t3);padding:12px 10px 0;border-top:1px solid var(--bd);line-height:1.7}
/* page */
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:18px;font-weight:700;letter-spacing:.2px}
.ph .sub{color:var(--t3);font-size:12px}
.ph .sp{flex:1}
.btn{background:var(--hi);border:1px solid var(--bd2);color:var(--t1);border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.pri{background:linear-gradient(135deg,var(--gold),var(--gold3));border:0;color:#14100a;font-weight:700}
.btn.pri:hover{filter:brightness(1.08);color:#14100a}
select,input.f{background:var(--inset);border:1px solid var(--bd2);color:var(--t1);border-radius:8px;padding:7px 11px;font-size:12.5px;outline:none}
select:focus,input.f:focus{border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:13px}
.k4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.card{background:linear-gradient(180deg,var(--card),rgba(20,23,29,.72));border:1px solid var(--bd);border-radius:12px;padding:14px}
.card>h3{font-size:12.5px;font-weight:600;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.card>h3:before{content:'';width:3px;height:12px;background:var(--gold);border-radius:2px}
.kpi .k{color:var(--t3);font-size:11.5px;letter-spacing:.3px}
.kpi .v{font-size:23px;font-weight:750;margin-top:4px;letter-spacing:-.3px}
.kpi .d{color:var(--t3);font-size:11.5px}
.pill{display:inline-block;padding:1.5px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.p-up{background:var(--upS);color:var(--up)}.p-dn{background:var(--dnS);color:var(--dn)}
.p-g{background:var(--goldS);color:var(--gold2)}.p-w{background:var(--warnS);color:var(--warn)}
.p-i{background:var(--infoS);color:var(--info)}.p-m{background:rgba(130,139,153,.16);color:var(--t2)}
.up{color:var(--up)}.dn{color:var(--dn)}.muted{color:var(--t3)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
th{color:var(--t3);font-weight:500;font-size:11.5px;position:sticky;top:0;background:#14171d;z-index:2;cursor:default}
th.s{cursor:pointer}th.s:hover{color:var(--gold2)}
tbody tr:hover td{background:rgba(201,164,92,.045)}
.scroll{overflow:auto;max-height:68vh;border-radius:10px}
.pager{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--t3);font-size:12px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:4px 11px;border-radius:999px;font-size:11.5px;border:1px solid var(--bd2);background:var(--inset);color:var(--t2);cursor:pointer}
.chip.on{background:var(--gold);color:#14100a;border-color:var(--gold);font-weight:700}
.tabs{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:9px}
.tab{padding:6px 13px;border-radius:8px;color:var(--t2);cursor:pointer;font-size:12.5px;border:1px solid transparent}
.tab:hover{color:var(--t1);background:var(--hi)}
.tab.on{background:var(--goldS);color:var(--gold2);border-color:rgba(201,164,92,.36);font-weight:600}
.chart{width:100%;height:290px}
.live{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline;padding:13px 16px;border-radius:12px;border:1px solid rgba(201,164,92,.30);background:linear-gradient(135deg,var(--goldS),rgba(43,164,113,.04));margin-bottom:14px}
.live .px{font-size:30px;font-weight:800;letter-spacing:-.6px}
.live .c{font-size:11.5px;color:var(--t3)}.live .c b{color:var(--t1);font-size:13.5px}
.banner{border-radius:12px;padding:13px 16px;border:1px solid rgba(201,164,92,.32);margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,var(--goldS),rgba(154,134,216,.05))}
.banner .act{font-size:20px;font-weight:800}
pre{white-space:pre-wrap;color:var(--t2);background:var(--inset);border:1px solid var(--bd);border-radius:10px;padding:12px;line-height:1.75}
.sk{height:14px;border-radius:6px;margin:7px 0;background:linear-gradient(90deg,#151922 25%,#1d222c 37%,#151922 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{padding:22px;text-align:center;color:var(--t3)}
.tagline{font-size:11.5px;color:var(--t3)}
.roles{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.idx{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;min-width:128px}
.idx .n{font-size:11.5px;color:var(--t3)}
.idx .p{font-size:16px;font-weight:700}
.hint{font-size:11.5px;color:var(--t3);margin-top:6px}


/* ===== premium polish ===== */
.kchart{grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}
.chart.sm{height:212px}
.card{box-shadow:0 10px 30px -22px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.02) inset}
.card:hover{border-color:#2b313d}
.ph h1{font-size:19px;letter-spacing:.2px}
.top{backdrop-filter:saturate(140%) blur(8px)}
.gsearch input::placeholder{color:#5c636e}
.tki span{font-variant-numeric:tabular-nums}
.idx{background:linear-gradient(180deg,var(--card),rgba(20,23,29,.6));transition:.15s}
.idx:hover{border-color:var(--bd2)}

/* ===== Markdown 文档排版 ===== */
.md{line-height:1.85}
.mdp{margin:5px 0}
.mdt{width:100%;border-collapse:collapse;margin:9px 0;font-size:12.5px;border-radius:8px;overflow:hidden}
.mdt th,.mdt td{border:1px solid var(--bd);padding:6px 10px;text-align:right;white-space:nowrap}
.mdt th{background:rgba(201,164,92,.10);color:var(--gold2);font-weight:600;text-align:right}
.mdt th:first-child,.mdt td:first-child{text-align:left}
.mdt tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.mdul,.mdol{margin:6px 0 6px 20px}
.mdul li,.mdol li{margin:3px 0;line-height:1.75}
.mdh{margin:11px 0 5px;font-size:14px;color:var(--gold2);font-weight:700}
.mdq{border-left:3px solid var(--gold);padding:4px 12px;color:var(--t2);margin:7px 0;background:rgba(201,164,92,.05);border-radius:0 8px 8px 0}
.mdhr{border:0;border-top:1px solid var(--bd);margin:11px 0}
.cite{color:var(--gold2);font-size:11px;background:var(--goldS);padding:1px 6px;border-radius:6px;margin:0 2px;white-space:nowrap}
.md b{color:#fff}

/* ===== UI v2 · 全局统一美化 ===== */
:root{--r:12px;--r2:10px;--sh:0 12px 34px -24px rgba(0,0,0,.95)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#262c37;border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#343c4a;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
.ph{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.ph h1{font-size:21px;font-weight:800;letter-spacing:.3px;position:relative;padding-left:14px}
.ph h1:before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold3))}
.ph .sub{margin-top:3px}
.card{border-radius:var(--r);box-shadow:var(--sh)}
.card>h3{letter-spacing:.3px}
.btn{border-radius:var(--r2);transition:.15s;font-weight:500}
.btn:hover{transform:translateY(-1px)}
.btn.pri{box-shadow:0 6px 18px -10px rgba(201,164,92,.75)}
.chip{transition:.15s}
.chip:hover{border-color:var(--gold);color:var(--gold2)}
.chip.on{box-shadow:0 4px 14px -8px rgba(201,164,92,.9)}
.tab{transition:.15s}
.tab.on{box-shadow:0 4px 14px -10px rgba(201,164,92,.9)}
.grid{gap:14px}
th{background:#141822}
tbody tr{transition:background .12s}
.idx{border-radius:var(--r2);transition:.15s}
.idx:hover{border-color:var(--gold3)}
.kpi .v{letter-spacing:-.4px}
.pill{letter-spacing:.2px}
.nav a{transition:.13s}
.nav a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px;opacity:.9}
.nav a.on svg{opacity:1;filter:drop-shadow(0 0 6px rgba(201,164,92,.55))}

/* ===== 移动端 · 抽屉式导航 + 响应式 ===== */
.hamb{display:none;background:transparent;border:0;color:var(--t1);font-size:20px;line-height:1;padding:4px 8px;cursor:pointer;border-radius:8px}
.hamb:hover{background:var(--hi)}
.sidescrim{display:none}
@media(max-width:900px){
 .side{top:0;bottom:0;left:0;width:230px;transform:translateX(-100%);transition:transform .22s ease;z-index:80;padding-top:58px}
 .side.open{transform:none;box-shadow:0 0 44px rgba(0,0,0,.65)}
 .side .nav a{font-size:13px;justify-content:flex-start;padding:10px 12px}
 .side .nav .grp{display:block}
 .side .foot{display:block}
 .sidescrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70}
 .sidescrim.open{display:block}
 .hamb{display:inline-flex;align-items:center}
 .top{height:52px;flex-wrap:nowrap;gap:10px;padding:0 12px}
 .brand span{display:none}
 .tsr{display:none}
 .gsearch{width:auto;flex:1}
 .main{margin:0 0 0 0;padding:12px;padding-top:64px}
 .ph{margin-bottom:14px}
 .ph h1{font-size:18px}
 .k4{grid-template-columns:1fr 1fr}
 .kchart{grid-template-columns:1fr}
 .grid.roles{grid-template-columns:1fr}
 .chart{height:230px}
 .chart.sm{height:198px}
 .scroll{max-height:none}
 .live{flex-wrap:wrap;gap:10px}
 .live .px{font-size:24px}
 .ph .sp{flex-basis:100%;height:0}
 .btn{padding:7px 11px}
 select,input.f{padding:8px 10px}
}
@media(max-width:520px){ .k4{grid-template-columns:1fr} .tabs{gap:2px} .tab{padding:6px 10px;font-size:12px} }

.spkwrap{position:relative;display:block;margin-top:8px}
.idx .spk{width:100%;height:30px;display:block;opacity:.95}
.spkdot{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid #0d0f12;box-sizing:border-box}
.spkdot.dmax{background:#e5483f;box-shadow:0 0 7px rgba(229,72,63,.85)}
.spkdot.dmin{background:#2ba471;box-shadow:0 0 7px rgba(43,164,113,.85)}
.idx{min-width:150px}
</style>
</head>
<body>
<div class="top">
  <button class="hamb" onclick="toggleNav()" aria-label="菜单">☰</button>
  <div class="brand"><i></i>财报分析智能体 <span>上市公司财务报告分析</span></div>
  <div class="tsr" id="ticker"></div>
  <div class="gsearch"><input id="q" placeholder="搜索代码 / 名称" autocomplete="off" oninput="onType()" onkeydown="onKey(event)"></div>
</div>
<div class="sidescrim" id="scrim" onclick="toggleNav()"></div>
<div class="side">
    <nav class="nav" id="nav">
    <a data-v="ask"><svg viewBox="0 0 16 16"><path d="M2 3h12v8H5l-3 3z"/></svg> 问财报（Agent）</a>
    <a data-v="demo"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v6M5.5 8h5"/></svg> 作品演示</a>
    <div class="grp">市场</div>
    <a data-v="dash"><svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg> 总览</a>
    <a data-v="market"><svg viewBox="0 0 16 16"><path d="M1 11l4-5 3 3 4-6 3 3"/></svg> 市场异动</a>
    <a data-v="tracks"><svg viewBox="0 0 16 16"><path d="M3 2v12M3 3h9l-2 3 2 3H3"/></svg> 财报赛道</a>
    <a data-v="research"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1 2 2 5 2s5-1 5-2V4"/></svg> 全市场分析库</a>
    <div class="grp">研究</div>
    <a data-v="stock"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4"/><path d="M10.5 10.5L14 14"/></svg> 个股分析</a>
    <a data-v="compare"><svg viewBox="0 0 16 16"><path d="M2 5h9M8 2l3 3-3 3M14 11H5M8 8l-3 3 3 3"/></svg> 多股对比</a>
    <a data-v="screener"><svg viewBox="0 0 16 16"><path d="M2 2h12l-5 6v5l-2 1V8z"/></svg> 全市场选股</a>
    <a data-v="factors"><svg viewBox="0 0 16 16"><path d="M3 13V7M8 13V3M13 13V9"/></svg> 因子分层</a>
    <a data-v="lab"><svg viewBox="0 0 16 16"><path d="M6 2h4M7 2v5l-3 6a1 1 0 001 1h6a1 1 0 001-1l-3-6V2"/></svg> 回测实验室</a>
    <a data-v="portfolio"><svg viewBox="0 0 16 16"><path d="M8 2l6 4v8H2V6zM6 14V9h4v5"/></svg> 组合风控</a>
    <a data-v="roundtable"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.2"/></svg> 圆桌研判</a>
    <a data-v="fraud"><svg viewBox="0 0 16 16"><path d="M8 1l2 1h3v3c0 3-2 5-5 6-3-1-5-3-5-6V2h3z"/><path d="M6 8l1.5 1.5L10 7"/></svg> 造假验证</a>
    <a data-v="positions"><svg viewBox="0 0 16 16"><path d="M8 2l6 6-6 6-6-6z"/></svg> 我的持仓</a>
    <div class="grp">跟踪</div>
    <a data-v="watch"><svg viewBox="0 0 16 16"><path d="M8 2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.8 4.4 13l.7-4L2.2 6.3l4-.6z"/></svg> 自选跟踪</a>
    <a data-v="alerts"><svg viewBox="0 0 16 16"><path d="M8 2a4 4 0 00-4 4v3l-1 2h10l-1-2V6a4 4 0 00-4-4zM6.5 13a1.5 1.5 0 003 0"/></svg> 预警清单 <span id="an" class="pill p-up" style="display:none"></span></a>
    <a data-v="audit"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M5 8l2 2 4-4"/></svg> 审计校准</a>
    <div class="grp">数据</div>
    <a data-v="warehouse"><svg viewBox="0 0 16 16"><path d="M2 6l6-4 6 4v8H2zM6 14V9h4v5"/></svg> 数据仓库</a>
    <a data-v="qq"><svg viewBox="0 0 16 16"><rect x="3" y="4" width="10" height="8" rx="2"/><path d="M8 4V2M6 8h.01M10 8h.01"/></svg> QQ 机器人</a>
  </nav>
  <div class="foot">数据：东财 / 腾讯 / akshare<br>全市场 5571 家 · 报告期自动探测<br><span id="mstat">—</span></div>
</div>
<main class="main" id="main"><div class="spin">正在加载财报分析智能体…<div class="hint" style="margin-top:8px">若长时间无响应，请强制刷新（Cmd/Ctrl+Shift+R）</div></div></main>
<script>
var IDXSPK=null;
var D=null,CH=[],MK=null,MS={k:'np_yoy',d:-1,p:1,s:50},MF='全部',SUG=[],MKTD='',CMP=[];
function el(i){return document.getElementById(i)}
window.addEventListener('error',function(e){try{var m=document.getElementById('main');if(m&&!m.dataset.ok){m.dataset.ok='1';m.innerHTML='<div class="card"><span class="pill p-up">页面出错</span> '+String((e&&e.message)||'').slice(0,120)+' <button class="btn" onclick="location.reload()">刷新</button></div>'}}catch(x){}});
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function fmt(v){if(v===null||v===undefined||v==='')return '—';if(typeof v!=='number')return v;var a=Math.abs(v);if(a>=1e8)return (v/1e8).toFixed(2)+'亿';if(a>=1e4)return (v/1e4).toFixed(2)+'万';if(a>=100)return v.toFixed(0);return v.toFixed(2)}
function pct(v){return (v===null||v===undefined)?'—':(v>0?'+':'')+Number(v).toFixed(2)+'%'}
function pc(v){return (v===null||v===undefined)?'—':Number(v).toFixed(1)+'%'}
function n2(v){return (v===null||v===undefined)?'—':Number(v).toFixed(2)}
function tc(v){return v>0?'up':(v<0?'dn':'')}
function sk(n){var s='';for(var i=0;i<(n||4);i++)s+='<div class="sk"></div>';return s}
function clearCharts(){CH.forEach(function(c){try{c.dispose()}catch(e){}});CH=[]}
function draw(id,o){var e=el(id);if(!e)return;if(typeof echarts==='undefined'){setTimeout(function(){draw(id,o)},150);return}var c=echarts.init(e);c.setOption(o);CH.push(c)}
function kv(k,v,d,c){return '<div class="card kpi"><div class="k">'+k+'</div><div class="v num '+(c||'')+'">'+v+'</div><div class="d">'+(d||'')+'</div></div>'}
function A(o){return {axisLabel:{color:'#828b99'},splitLine:{lineStyle:{color:'#232833'}}}}
function _mdInline(s){
 return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>')

   var head=ln.split('|').slice(1,-1).map(function(x){return x.trim()});
   i+=2; var rows=[];
   while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])){ rows.push(L[i].split('|').slice(1,-1).map(function(x){return x.trim()})); i++; }

    rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+_mdInline(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>');
   continue;
  }
  var mh=ln.match(/^(#{1,4})\s+(.*)$/);
  if(mh){ var lv=Math.min(6, mh[1].length+2); out.push('<div class="mdh">'+_mdInline(mh[2])+'</div>'); i++; continue; }
  if(/^\s*-{3,}\s*$/.test(ln)){ out.push('<hr class="mdhr">'); i++; continue; }
  if(/^\s*(?:&gt;|>)\s?/.test(ln)){ var q=[]; while(i<L.length && /^\s*(?:&gt;|>)\s?/.test(L[i])){ q.push(L[i].replace(/^\s*(?:&gt;|>)\s?/,'')); i++; } out.push('<div class="mdq">'+_mdInline(q.join('<br>'))+'</div>'); continue; }
  if(/^\s*[-*·]\s+/.test(ln)){ var u=[]; while(i<L.length && /^\s*[-*·]\s+/.test(L[i])){ u.push(L[i].replace(/^\s*[-*·]\s+/,'')); i++; } out.push('<ul class="mdul">'+u.map(function(x){return '<li>'+_mdInline(x)+'</li>'}).join('')+'</ul>'); continue; }
  if(/^\s*\d+[.)]\s+/.test(ln)){ var o=[]; while(i<L.length && /^\s*\d+[.)]\s+/.test(L[i])){ o.push(L[i].replace(/^\s*\d+[.)]\s+/,'')); i++; } out.push('<ol class="mdol">'+o.map(function(x){return '<li>'+_mdInline(x)+'</li>'}).join('')+'</ol>'); continue; }
  if(!ln.trim()){ i++; continue; }
  var p=[ln]; i++;
  while(i<L.length && L[i].trim() && !/^\s*([-*·]|\d+[.)]|#|>|\|)/.test(L[i])){ p.push(L[i]); i++; }

 }

}

function testQQ(){el('qres').textContent='发送中…';jpost('/api/qq/test',{target_type:el('qtt').value,target_id:el('qto').value.trim(),text:el('qtxt').value.trim()}).then(function(r){el('qres').textContent=JSON.stringify(r)})}
function runQQCmd(){el('qcres').textContent='运行中…';jpost('/api/qq/command',{text:el('qcmd').value.trim()}).then(function(r){el('qcres').textContent=r.reply||''})}

/* ============ 启动 ============ */
loadTicker();setInterval(loadTicker,60000);
jget('/api/alerts').then(function(a){badge(((a.items||[]).length))}).catch(function(){});
if(!location.hash)location.hash='#/dash';
route();
</script>
